[project]
name = "ibindex-portfolio"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.0",
    "requests>=2.32",
    "streamlit>=1.35",
    "psycopg[binary]>=3.1",
    "yfinance>=0.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "scraper", "app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
