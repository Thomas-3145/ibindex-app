apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pinned by CI after each image build (kustomize edit set image).
# ArgoCD only reacts to Git changes, so a floating :latest tag never
# triggers a rollout — the pinned tag here is what drives deploys.
images:
- name: ghcr.io/thomas-3145/ibindex-app
  newTag: sha-7cc60686f3b6724e55b48e41499576d1ee3850d7

resources:
- namespace.yaml
- postgres-pvc.yaml
- postgres-deployment.yaml
- postgres-service.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- cronjob.yaml

generators:
- ksops-generator.yaml
