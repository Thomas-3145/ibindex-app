apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ibindex
spec:
  replicas: 1
  # RWO PVC: a rolling update would schedule the new pod while the old one
  # still holds the volume, deadlocking the rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ibindex
            - name: POSTGRES_USER
              value: ibindex
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibindex-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ibindex"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
